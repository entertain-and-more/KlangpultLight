name: KlangpultLight CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-contract-tests:
    name: Lint & Contract Tests (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Contract and Static Verification Tests
        run: pytest tests/test_planer_accessibility_static.py tests/test_metadata.py
