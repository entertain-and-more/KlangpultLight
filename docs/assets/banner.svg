<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Radial Glow behind Catapult -->
    <radialGradient id="launchGlow" cx="20%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Glow top right flight arc -->
    <radialGradient id="arcGlow" cx="60%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Primary Gradient -->
    <linearGradient id="wood1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a5b32" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Wood Secondary Gradient -->
    <linearGradient id="wood2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Metal Steel Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Note Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Note Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Magenta Note Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Arc Stroke Gradient -->
    <linearGradient id="arcStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#launchGlow)" />
  <rect width="1200" height="630" fill="url(#arcGlow)" />

  <!-- Background Decorative Grid / Audio Frequencies -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Background Equalizer Wave -->
  <g opacity="0.08" fill="#38bdf8">
    <rect x="50" y="480" width="6" height="40" rx="3" />
    <rect x="65" y="460" width="6" height="60" rx="3" />
    <rect x="80" y="440" width="6" height="80" rx="3" />
    <rect x="95" y="470" width="6" height="50" rx="3" />
    <rect x="110" y="430" width="6" height="90" rx="3" />
    <rect x="1000" y="420" width="8" height="100" rx="4" />
    <rect x="1015" y="390" width="8" height="130" rx="4" />
    <rect x="1030" y="440" width="8" height="80" rx="4" />
    <rect x="1045" y="370" width="8" height="150" rx="4" />
    <rect x="1060" y="410" width="8" height="110" rx="4" />
    <rect x="1075" y="450" width="8" height="70" rx="4" />
    <rect x="1090" y="430" width="8" height="90" rx="4" />
  </g>

  <!-- Ground platform line -->
  <path d="M 60 540 L 1140 540" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- 2. FLIGHT ARC & TRAJECTORY -->
  <!-- Outer Glow Arc -->
  <path d="M 275 250 Q 560 50 1100 280" fill="none" stroke="#38bdf8" stroke-width="16" opacity="0.2" filter="url(#glowCyan)" />
  <path d="M 275 250 Q 560 50 1100 280" fill="none" stroke="#c084fc" stroke-width="10" opacity="0.25" filter="url(#glowPink)" />
  <!-- Main Dashed Arc -->
  <path d="M 275 250 Q 560 50 1100 280" fill="none" stroke="url(#arcStroke)" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" />
  <!-- Core Crisp White Line -->
  <path d="M 275 250 Q 560 50 1100 280" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

  <!-- Sound Shockwaves / Concentric rings bursting from Catapult Cup -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" filter="url(#glowCyan)">
    <path d="M 295 210 A 30 30 0 0 1 325 240" />
    <path d="M 310 190 A 50 50 0 0 1 355 245" stroke-width="2" opacity="0.5" />
    <path d="M 325 170 A 70 70 0 0 1 385 250" stroke-width="1.5" opacity="0.3" />
  </g>
  <g fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.6" filter="url(#glowPink)">
    <path d="M 270 230 A 25 25 0 0 0 250 200" />
    <path d="M 260 240 A 45 45 0 0 0 230 190" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Audio Waveform Ribbon floating along the Arc -->
  <path d="M 340 205 Q 360 190 380 205 T 420 205 T 460 205 T 500 205 T 540 205" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" filter="url(#glowCyan)" />

  <!-- 3. KLANGKATAPULT CONSTRUCTION -->
  <g id="klangkatapult" filter="url(#dropShadow)">
    <!-- Shadow under base -->
    <ellipse cx="200" cy="535" rx="110" ry="12" fill="#000000" opacity="0.5" />

    <!-- Rear Wheel -->
    <circle cx="120" cy="520" r="22" fill="url(#metal)" stroke="#0f172a" stroke-width="3" />
    <circle cx="120" cy="520" r="14" fill="#334155" />
    <circle cx="120" cy="520" r="5" fill="#94a3b8" />
    <line x1="120" y1="498" x2="120" y2="542" stroke="#64748b" stroke-width="2" />
    <line x1="98" y1="520" x2="142" y2="520" stroke="#64748b" stroke-width="2" />

    <!-- Front Wheel -->
    <circle cx="280" cy="520" r="22" fill="url(#metal)" stroke="#0f172a" stroke-width="3" />
    <circle cx="280" cy="520" r="14" fill="#334155" />
    <circle cx="280" cy="520" r="5" fill="#94a3b8" />
    <line x1="280" y1="498" x2="280" y2="542" stroke="#64748b" stroke-width="2" />
    <line x1="258" y1="520" x2="302" y2="520" stroke="#64748b" stroke-width="2" />

    <!-- Main Chassis Horizontal Timber Base Beam -->
    <rect x="90" y="492" width="220" height="24" rx="4" fill="url(#wood1)" stroke="#271202" stroke-width="2" />
    <!-- Iron Plate Reinforcements on Base -->
    <rect x="95" y="495" width="18" height="18" fill="url(#metal)" rx="2" />
    <circle cx="104" cy="504" r="2" fill="#e2e8f0" />
    <rect x="287" y="495" width="18" height="18" fill="url(#metal)" rx="2" />
    <circle cx="296" cy="504" r="2" fill="#e2e8f0" />

    <!-- Winch Tension Spool at Rear -->
    <rect x="125" y="468" width="24" height="24" rx="3" fill="url(#metal)" />
    <circle cx="137" cy="480" r="8" fill="#1e293b" />
    <path d="M 137 472 L 137 488 M 129 480 L 145 480" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Diagonal A-Frame Support Beams -->
    <!-- Back Beam -->
    <polygon points="120,492 195,370 215,370 140,492" fill="url(#wood2)" stroke="#271202" stroke-width="2" />
    <!-- Front Beam -->
    <polygon points="280,492 205,370 185,370 260,492" fill="url(#wood1)" stroke="#271202" stroke-width="2" />
    <!-- Crossbrace -->
    <rect x="145" y="430" width="110" height="16" rx="3" fill="url(#wood1)" stroke="#271202" stroke-width="1.5" transform="rotate(-5 200 438)" />

    <!-- Pivot Axle Plate (Center of Rotation) -->
    <circle cx="200" cy="375" r="20" fill="url(#metal)" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="200" cy="375" r="12" fill="#1e293b" />
    <circle cx="200" cy="375" r="5" fill="#f59e0b" filter="url(#glowGold)" />
    <!-- Rivets on Axle Plate -->
    <circle cx="188" cy="375" r="1.5" fill="#ffffff" />
    <circle cx="212" cy="375" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="363" r="1.5" fill="#ffffff" />
    <circle cx="200" cy="387" r="1.5" fill="#ffffff" />

    <!-- Tension Rope -->
    <line x1="137" y1="470" x2="185" y2="400" stroke="#d97706" stroke-width="3" stroke-dasharray="4 2" />
    <line x1="137" y1="473" x2="187" y2="405" stroke="#fbbf24" stroke-width="1.5" />

    <!-- THROWING ARM (Wurfarm) -->
    <polygon points="152,438 162,446 282,254 270,246" fill="url(#wood1)" stroke="#1c0a00" stroke-width="2" />

    <!-- Metal Bands on Arm -->
    <polygon points="182,398 189,404 195,395 188,389" fill="url(#metal)" />
    <polygon points="230,328 237,334 243,325 236,319" fill="url(#metal)" />

    <!-- Counterweight at lower end of arm -->
    <rect x="142" y="432" width="24" height="24" rx="4" fill="url(#metal)" stroke="#0f172a" stroke-width="2" />
    <circle cx="154" cy="444" r="6" fill="#f59e0b" />

    <!-- WURFLÖFFEL / CUP (Catapult Bucket holding audio energy) -->
    <path d="M 262 254 C 255 230, 285 215, 302 235 C 310 245, 290 265, 270 258 Z" fill="url(#metal)" stroke="#0f172a" stroke-width="2" />
    <ellipse cx="282" cy="238" rx="16" ry="10" fill="#0284c7" filter="url(#glowCyan)" opacity="0.9" />

    <!-- Glowing Musical Energy inside Cup -->
    <circle cx="282" cy="236" r="10" fill="#ffffff" filter="url(#glowCyan)" />
    <circle cx="282" cy="236" r="6" fill="#38bdf8" />
  </g>

  <!-- 4. FLYING SOUND OBJECTS (MUSIKNOTEN & KLANGWELLEN) -->

  <!-- Item 1: Audio Orb near Launch (x=340, y=190) -->
  <g transform="translate(330, 175) rotate(-15)" filter="url(#glowCyan)">
    <circle cx="20" cy="20" r="18" fill="url(#cyanGrad)" opacity="0.9" />
    <path d="M 14 26 L 14 14 L 26 11 L 26 23 M 14 18 L 26 15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="11" cy="26" r="3.5" fill="#ffffff" />
    <circle cx="23" cy="23" r="3.5" fill="#ffffff" />
  </g>

  <!-- Item 2: Large Golden Double Eighth Note ♫ (Apex of Arc: x=540, y=90) -->
  <g transform="translate(510, 60) rotate(12)" filter="url(#glowGold)">
    <path d="M 22 55 L 22 18 L 52 10 L 52 47 M 22 28 L 52 20" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <ellipse cx="14" cy="55" rx="10" ry="7" transform="rotate(-20 14 55)" fill="url(#goldGrad)" />
    <ellipse cx="44" cy="47" rx="10" ry="7" transform="rotate(-20 44 47)" fill="url(#goldGrad)" />
    <circle cx="52" cy="10" r="4" fill="#ffffff" />
  </g>

  <!-- Item 3: Magenta Eighth Note ♪ (x=690, y=95) -->
  <g transform="translate(680, 80) rotate(-18)" filter="url(#glowPink)">
    <path d="M 20 45 L 20 12 C 28 12, 36 18, 38 28" stroke="url(#pinkGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <ellipse cx="13" cy="45" rx="9" ry="6.5" transform="rotate(-25 13 45)" fill="url(#pinkGrad)" />
    <path d="M 42 12 A 18 18 0 0 1 42 36" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 48 6 A 26 26 0 0 1 48 42" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Item 4: Equalizer Burst Flying Projectile (x=820, y=130) -->
  <g transform="translate(800, 110) rotate(25)" filter="url(#glowCyan)">
    <rect x="0" y="20" width="7" height="35" rx="3.5" fill="#38bdf8" />
    <rect x="11" y="10" width="7" height="55" rx="3.5" fill="#f59e0b" />
    <rect x="22" y="0" width="7" height="75" rx="3.5" fill="#ffffff" />
    <rect x="33" y="15" width="7" height="45" rx="3.5" fill="#f43f5e" />
    <rect x="44" y="25" width="7" height="25" rx="3.5" fill="#c084fc" />
  </g>

  <!-- Item 5: Quarter Note ♩ (x=940, y=185) -->
  <g transform="translate(930, 170) rotate(15)" filter="url(#glowGold)">
    <path d="M 22 42 L 22 10" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <ellipse cx="15" cy="42" rx="8" ry="6" transform="rotate(-20 15 42)" fill="url(#goldGrad)" />
  </g>

  <!-- Item 6: Sound Wave Rings Landing Impact (x=1060, y=260) -->
  <g transform="translate(1040, 240)" filter="url(#glowCyan)">
    <circle cx="30" cy="30" r="15" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <circle cx="30" cy="30" r="30" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6" />
    <circle cx="30" cy="30" r="45" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.3" />
    <circle cx="30" cy="30" r="5" fill="#ffffff" />
  </g>

  <!-- Floating Sparkles & Star Particles in Trajectory -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M 420 130 L 423 136 L 429 139 L 423 142 L 420 148 L 417 142 L 411 139 L 417 136 Z" fill="#38bdf8" filter="url(#glowCyan)" />
    <path d="M 640 65 L 642 70 L 647 72 L 642 74 L 640 79 L 638 74 L 633 72 L 638 70 Z" fill="#fbbf24" filter="url(#glowGold)" />
    <path d="M 880 120 L 882 125 L 887 127 L 882 129 L 880 134 L 878 129 L 873 127 L 878 125 Z" fill="#f43f5e" filter="url(#glowPink)" />
    <circle cx="370" cy="230" r="3" fill="#38bdf8" />
    <circle cx="480" cy="110" r="2.5" fill="#ffffff" />
    <circle cx="600" cy="85" r="3.5" fill="#f59e0b" />
    <circle cx="750" cy="115" r="2" fill="#c084fc" />
    <circle cx="850" cy="160" r="3" fill="#38bdf8" />
    <circle cx="1000" cy="220" r="2.5" fill="#ffffff" />
  </g>

  <!-- 5. TYPOGRAPHY & BRANDING (Right / Lower-Center Area) -->
  <g id="branding" transform="translate(490, 360)">
    <!-- Sub-glow behind text -->
    <rect x="-20" y="-10" width="670" height="200" rx="20" fill="#0f172a" opacity="0.6" filter="url(#dropShadow)" />
    <rect x="-20" y="-10" width="670" height="200" rx="20" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7" />

    <!-- Main Title: Klangpult light -->
    <text x="10" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="#ffffff" filter="url(#dropShadow)">
      Klangpult <tspan fill="#38bdf8">light</tspan>
    </text>

    <!-- Subtitle: The audio catapult for your desktop -->
    <text x="12" y="104" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2" fill="#94a3b8">
      The audio catapult for your desktop
    </text>
    <text x="12" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5" fill="#38bdf8" opacity="0.9">
      LOCAL-FIRST AUDIO &amp; VIDEO RECORDING
    </text>

    <!-- Badges / Feature Pills -->
    <g transform="translate(12, 152)">
      <!-- Badge 1: Local-First -->
      <rect x="0" y="0" width="114" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="12" cy="13" r="4" fill="#38bdf8" />
      <text x="24" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">LOCAL-FIRST</text>

      <!-- Badge 2: Freeware -->
      <rect x="124" y="0" width="94" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="136" cy="13" r="4" fill="#f59e0b" />
      <text x="148" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">FREEWARE</text>

      <!-- Badge 3: Audio & Video -->
      <rect x="228" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="240" cy="13" r="4" fill="#c084fc" />
      <text x="252" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">AUDIO &amp; VIDEO</text>
    </g>
  </g>

  <!-- Accent Corner Glow -->
  <circle cx="1200" cy="0" r="200" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)" />
</svg>
