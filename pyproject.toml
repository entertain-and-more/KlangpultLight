[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klangpult-light"
version = "0.1.0"
description = "Lightweight desktop & web application (Recorder + Planer) for audio/video recordings and media planning."
readme = "README.md"
license = {text = "Freeware / Proprietary"}
requires-python = ">=3.10"
authors = [{name = "Lukas Geiger", email = "support@lukasgeiger.com"}]
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "opencv-python>=4.9",
    "mss>=9.0",
    "websockets>=12.0",
    "jsonschema>=4.21",
]

keywords = [
    "audio",
    "audio-mixer",
    "audio-production",
    "audio-recorder",
    "desktop-app",
    "freeware",
    "local-first",
    "mixing-console",
    "podcast",
    "python",
    "windows",
    "live-transcription",
    "pyside6",
    "teleprompter",
    "ai-monitor",
    "multitrack-recording",
    "offline-first",
    "podcast-studio",
    "zero-egress",
    "episode-planner",
]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Capture"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]
stt = [
    "faster-whisper>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/entertain-and-more/KlangpultLight"
Repository = "https://github.com/entertain-and-more/KlangpultLight.git"
Documentation = "https://github.com/entertain-and-more/KlangpultLight#readme"
Issues = "https://github.com/entertain-and-more/KlangpultLight/issues"
Changelog = "https://github.com/entertain-and-more/KlangpultLight/blob/main/CHANGELOG.md"
Security = "https://github.com/entertain-and-more/KlangpultLight/blob/main/SECURITY.md"
Notice = "https://github.com/entertain-and-more/KlangpultLight/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/entertain-and-more/KlangpultLight/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/entertain-and-more/KlangpultLight/blob/main/THIRD_PARTY_LICENSES.txt"
"Marketing Log" = "https://github.com/entertain-and-more/KlangpultLight/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/entertain-and-more"
Ecosystem = "https://github.com/entertain-and-more"
Umbrella = "https://github.com/open-bricks/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["Recorder/tests", "tests"]
pythonpath = ["."]
norecursedirs = [".git", ".github", "workspace", "_archive", "releases", "dist", "build", "node_modules", ".playwright-cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
