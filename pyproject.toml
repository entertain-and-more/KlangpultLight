[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klangpult-light"
version = "0.1.0"
description = "Lightweight desktop & web application (Recorder + Planer) for audio/video recordings and media planning."
readme = "README.md"
license = {text = "Freeware / Proprietary"}
requires-python = ">=3.10"
authors = [{name = "Lukas Geiger"}]
keywords = [
    "audio",
    "video",
    "recorder",
    "podcast",
    "media-planning",
    "teleprompter",
    "pyside6",
    "freeware",
    "local-first",
    "zero-egress",
    "entertain-and-more"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Capture"
]

[project.urls]
Homepage = "https://github.com/entertain-and-more/KlangpultLight"
Repository = "https://github.com/entertain-and-more/KlangpultLight.git"
Documentation = "https://github.com/entertain-and-more/KlangpultLight#readme"
Issues = "https://github.com/entertain-and-more/KlangpultLight/issues"
Changelog = "https://github.com/entertain-and-more/KlangpultLight/blob/main/CHANGELOG.md"
Security = "https://github.com/entertain-and-more/KlangpultLight/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/entertain-and-more"
Ecosystem = "https://github.com/entertain-and-more"
Umbrella = "https://github.com/open-bricks/open-bricks"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["Recorder/tests", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
