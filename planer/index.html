<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klangpult light – Planer</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b3142" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header id="app-header">
  <div class="logo">Klangpult light<span data-i18n="planer_title"> – Planer</span></div>

  <!-- Tabs werden von main.js eingefügt -->
  <nav id="nav-tabs" aria-label="Hauptnavigation"></nav>

  <!-- Reload-Button -->
  <button id="btn-reload" class="btn btn-ghost" type="button" data-i18n-title="reload_view" data-i18n-aria-label="reload_view" title="Aktuelle Ansicht neu laden" aria-label="Aktuelle Ansicht neu laden" style="margin-left: 0.5rem;">↺</button>

  <!-- Sprachauswahl / Language Selector -->
  <select id="lang-select" class="lang-selector" aria-label="Sprache / Language" title="Sprache wählen">
    <option value="de">Deutsch (de)</option>
    <option value="en">English (en)</option>
    <option value="es">Español (es)</option>
    <option value="zh">简体中文 (zh)</option>
    <option value="ja">日本語 (ja)</option>
    <option value="ru">Русский (ru)</option>
  </select>

  <!-- Recorder-Status -->
  <div id="status-indicator" role="status" aria-live="polite" aria-atomic="true">
    <div id="status-dot" class="status-dot offline"></div>
    <span id="status-text" data-i18n="checking_connection">Prüfe Verbindung…</span>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main id="app-main">
  <!--
    View-Divs und Detail-Panel werden von main.js erzeugt / referenziert.
    Das Detail-Panel muss im HTML stehen (letztes Kind von #app-main).
  -->
  <div id="detail-panel"></div>
</main>

<!-- ESM-Einstieg -->
<script type="module" src="app/main.js"></script>

</body>
</html>
